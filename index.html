/* Rediseño compacto: conserva proporciones y densidad de las tarjetas originales */
.picks-summary{padding:14px 16px;background:linear-gradient(110deg,#101c30,#0d1728);border-color:#293b56}
.picks-summary h2{font-size:19px;letter-spacing:0}
.picks-summary p{font-size:12px}
.pick-compact-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.pick-compact-row{width:100%;display:grid;grid-template-columns:minmax(180px,1.5fr) minmax(150px,1fr) 82px 24px;align-items:center;gap:12px;padding:9px 10px;background:transparent;color:var(--txt);border:0;border-radius:9px;text-align:left}
.pick-compact-row:hover{background:rgba(109,168,255,.07)}
.pick-compact-teams{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);align-items:center;gap:7px;min-width:0}
.pick-compact-team{display:flex;align-items:center;gap:7px;min-width:0;font-size:12px}
.pick-compact-team b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-compact-team:last-child{justify-content:flex-end}
.pick-compact-team .pick-feature-crest{font-style:normal;width:23px;height:23px;min-width:23px;font-size:8px}
.pick-compact-market,.pick-compact-prob{display:flex;flex-direction:column;gap:3px;min-width:0}
.pick-compact-market small,.pick-compact-prob small{font-size:8px;color:var(--muted);font-weight:800;letter-spacing:.06em}
.pick-compact-market b{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-compact-prob b{font-size:13px;color:var(--green);font-variant-numeric:tabular-nums}
.pick-compact-chevron{font-size:19px;color:var(--muted);text-align:center;transition:transform .18s}
.pick-feature-card.open .pick-compact-chevron{transform:rotate(180deg);color:var(--green)}
.pick-feature-card .pick-expanded{display:none;padding:9px 10px 3px;border-top:1px solid rgba(73,97,126,.25);margin-top:3px}
.pick-feature-card.open .pick-expanded{display:block}
.pick-detail-foot{display:flex;justify-content:space-between;gap:8px;margin:9px 0 3px;color:var(--muted);font-size:10px}

.pick-feature-card{background:linear-gradient(110deg,#101c30,#0d1728);border:1px solid #293b56;border-radius:13px;padding:10px 12px;margin:8px 0;box-shadow:none}

.pick-competition{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.04em}

.goals-market b{color:var(--green)}
.goals-prob b{color:var(--green)}
.goals-summary{margin:10px 0 0;color:#b4c4d9;font-size:11px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.goals-empty-state{padding:22px;text-align:center}
.goals-empty-state h3{margin:0 0 5px;font-size:15px}
.goals-empty-state p{margin:0;color:var(--muted);font-size:12px}

 .goals-market b,.goals-prob b,.goals-odds b{font-size:11px}
 .goals-summary{margin-top:8px;font-size:10px}
}

async function ensureFifteenSteps(){
 // Create only missing rows. Existing step records are preserved.
 for(const slug of ["stonicx7","eajoya7"]){
  const l=ladders[slug], existing=steps.filter(x=>x.ladder_id===l.id);
  const byNo=new Map(existing.map(x=>[Number(x.step_number),x]));
  let priorStake=num(l.initial_stake)||10000;
  for(let n=1;n<=15;n++){
   const old=byNo.get(n);
   if(old){priorStake=Math.round((num(old.stake)||priorStake)*(num(old.odds)||1.3));continue}
   const row={user_id:user.id,ladder_id:l.id,step_number:n,bet_date:today(),stake:Math.round(priorStake),odds:1.3,event:"",market:"",result:"pending"};
   const {data,error}=await db.from("stonicx_steps").insert(row).select().single();
   if(error)throw error;
   byNo.set(n,data);
   priorStake=Math.round(num(data.stake)*num(data.odds));
  }
 }
}
function nextStake(rows,l){
 const ordered=[...rows].sort((a,b)=>a.step_number-b.step_number);
 let current=num(l.initial_stake)||10000;
 for(const r of ordered){
  if(Number(r.step_number)>15)continue;
  current=num(r.stake)||current;
  if(r.result==="won")current=Math.round(current*num(r.odds));
  else if(r.result==="lost")return 0;
  else if(r.result==="pending")return current;
 }
 return current;
}
function projectLadderRows(rows,l){
 let previous=Number(l?.initial_stake)||10000;
 return [...rows].sort((a,b)=>Number(a.step_number)-Number(b.step_number)).map(r=>{
  const step=Number(r.step_number);
  const storedStake=Number(r.stake);
  const stake=step===1?(Number.isFinite(storedStake)?storedStake:previous):previous;
  const odds=Number(r.odds);
  const gain=Math.round(stake*(Number.isFinite(odds)&&odds>0?odds:1));
  previous=gain;
  return {...r,stake,gain};
 });
}

function ladderTable(rows){

   </div></td>
  </tr>`;
 }).join("")}
 </tbody></table>`;
}
async function saveStep(id,field,value){
 const row=steps.find(x=>x.id===id);
 if(field==="stake"&&Number(row?.step_number)!==1){notify("Solo se puede editar el valor inicial del punto 1.");return}
 const allowed={bet_date:value=>value,event:value=>value,market:value=>value,odds:value=>Math.max(1,num(value)),stake:value=>Math.max(0,num(value))};
 if(!allowed[field])return;
 const payload={[field]:allowed[field](value)};
 const {error}=await db.from("stonicx_steps").update(payload).eq("id",id);
 if(error){notify("Error al guardar: "+error.message);return}
 await refresh();render();notify("Paso actualizado.");
}
async function setResult(id,result){
 const {error}=await db.from("stonicx_steps").update({result}).eq("id",id);
 if(error){notify("Error al guardar resultado: "+error.message);return}
 await refresh();render();notify("Resultado guardado y saldo recalculado.");
}

 if(error)return alert(error.message);
 ladders[tab]=data;await refresh();render();
}
function table(rows,isPick){
 return `<table><thead><tr><th>Fecha</th>${isPick?'<th>Casa</th>':''}<th>Evento</th><th>Mercado</th><th>Cuota</th><th>Stake</th><th>Resultado</th><th></th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${r.bet_date||r.pick_date||"—"}</td>${isPick?`<td>${esc(r.bookmaker)}</td>`:""}<td>${esc(r.event)}</td><td>${esc(r.market)}</td><td>${r.odds}</td><td>${money(r.stake)}</td><td>${esc(r.result)}</td><td><button class="secondary" onclick="${isPick?`editPick('${r.id}')`:`editStep('${r.id}')`}">Editar</button></td></tr>`).join(""):`<tr><td colspan="8" class="muted">Sin registros todavía.</td></tr>`}</tbody></table>`;
}
function togglePickAnalysis(id){
 const row=document.getElementById("pick-"+id);
 if(!row)return;
 const wasOpen=row.classList.contains("open");
 document.querySelectorAll(".pick-feature-card.open").forEach(x=>x.classList.remove("open"));
 if(!wasOpen)row.classList.add("open");
}

async function addPick(){
 let r={user_id:user.id,pick_date:today(),bookmaker:prompt("Casa","Betano")||"",event:prompt("Evento","")||"",market:prompt("Mercado","")||"",odds:+(prompt("Cuota","1.5")||1.5),stake:+(prompt("Stake COP","10000")||10000),result:"pending"};
 let x=await db.from("stonicx_picks").insert(r);if(x.error)return alert(x.error.message);await refresh();render();
}
async function editPick(id){
 let r=picks.find(x=>x.id===id),result=prompt("pending / won / lost / void",r.result);if(result===null)return;
 let x=await db.from("stonicx_picks").update({result}).eq("id",id);if(x.error)return alert(x.error.message);await refresh();render();
}
db.auth.getSession().then(async({data})=>{if(data.session){user=data.session.user;try{await boot()}catch(e){alert(e.message)}}});
